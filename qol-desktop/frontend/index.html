<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- maximumScale bukan 1: mengunci zoom akan gagal WCAG 1.4.4. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <title>Student Hub &amp; Internship Logbook</title>
    <meta
      name="description"
      content="Sistem terpadu SKM, Task Report Magang PT Badak NGL, dan Log Book Konsultasi USTB Bontang."
    />
    <meta name="format-detection" content="telephone=no" />

    <!-- Sepasang, karena palet claymorphism punya latar terang dan gelap yang
         berbeda jauh: satu nilai tetap membuat bilah status ponsel menabrak
         halaman di salah satu tema. Nilainya = --background di globals.css. -->
    <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151923" media="(prefers-color-scheme: dark)" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Student Hub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Pengganti next/font/google. Bobot 400-800 sama persis dengan sebelumnya. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
