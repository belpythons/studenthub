<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{TITLE}}</title>
  </head>
  <!--
    Tata letak berbasis <table>, bukan flexbox: Outlook merender lewat mesin
    Word dan tidak mengenal flex sama sekali.

    Gaya neubrutalism-nya kebetulan juga gaya paling aman untuk email — blok
    warna rata, border padat, tanpa gradient, tanpa border-radius, tanpa
    bayangan lembut. Semuanya inline karena Gmail membuang <style> di <head>.
  -->
  <body style="margin:0;padding:0;background:#f4f1e8;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111111;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f1e8;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                 style="max-width:520px;background:#ffffff;border:2px solid #111111;">

            <!-- Kop: logo kampus pengguna bila ada, kalau tidak lambang project.
                 URL-nya wajib absolut — klien email tidak pernah memuat path
                 relatif; {{LOGO_URL}} diisi apply-email-templates.mjs. -->
            <tr>
              <td style="padding:24px 28px 20px;border-bottom:2px solid #111111;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td width="52" style="padding-right:14px;vertical-align:middle;">
                      <img src="{{ if .Data.logo_url }}{{ .Data.logo_url }}{{ else }}{{LOGO_URL}}{{ end }}"
                           width="44" height="44" alt=""
                           style="display:block;width:44px;height:auto;max-width:44px;border:0;" />
                    </td>
                    <td style="vertical-align:middle;">
                      <div style="font-size:16px;font-weight:800;letter-spacing:-0.01em;color:#111111;">
                        Student Hub
                      </div>
                      <div style="font-size:12px;color:#555555;margin-top:2px;">
                        {{ if .Data.instansi }}{{ .Data.instansi }}{{ else }}Log Book Magang &amp; SKM{{ end }}
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Isi -->
            <tr>
              <td style="padding:28px;">
                {{CONTENT}}

                <!-- Tombol besar polos -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                       style="margin:24px 0 8px;">
                  <tr>
                    <td style="background:#111111;">
                      <a href="{{ACTION_URL}}"
                         style="display:block;padding:16px 20px;background:{{ if .Data.warna_aksen }}{{ .Data.warna_aksen }}{{ else }}#0057a8{{ end }};border:2px solid #111111;color:#ffffff;font-size:16px;font-weight:700;text-align:center;text-decoration:none;position:relative;top:-4px;left:-4px;">
                        {{BUTTON}}
                      </a>
                    </td>
                  </tr>
                </table>

                <p style="margin:20px 0 0;font-size:12px;line-height:1.6;color:#555555;">
                  Tombolnya tidak bisa diklik? Salin dan tempel tautan ini ke peramban:<br />
                  <span style="word-break:break-all;color:#0057a8;">{{ACTION_URL}}</span>
                </p>

                <p style="margin:16px 0 0;font-size:12px;line-height:1.6;color:#555555;">
                  {{FOOTNOTE}}
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding:14px 28px;border-top:2px solid #111111;background:#f4f1e8;font-size:11px;color:#555555;">
                Email otomatis dari Student Hub. Mohon jangan dibalas.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
